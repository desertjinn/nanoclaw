name: Publish agent image

on:
  push:
    branches: [main]
    paths: ['container/**']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/desertjinn/nanoclaw-agent
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./container
          file: ./container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/desertjinn/nanoclaw-agent
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Output digest to summary
        run: |
          echo "### Agent image digest" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/desertjinn/nanoclaw-agent@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
